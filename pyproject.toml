[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logsift"
version = "0.1.0"
description = "Search and make sense of log files on your own machine: one command, any format, no server to run"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Syed Ali" }]
keywords = ["logs", "log-analysis", "search", "observability", "devops", "sre", "nginx", "syslog"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
    "Environment :: Web Environment",
]

[project.scripts]
logsift = "logsift.cli:main"

[project.urls]
Homepage = "https://github.com/zeexduaa/logsift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
